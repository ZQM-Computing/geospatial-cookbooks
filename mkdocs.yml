site_name: Geospatial Patterns
site_description: Practical GIS and geospatial engineering examples across QGIS, GDAL, GeoPandas, PostGIS, DuckDB Spatial, GeoParquet, H3, STAC, COG, OGC APIs, and web mapping.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/geospatial-cookbooks

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
