site_name: Geospatial Patterns
site_description: Umbrella index for all ZQM geospatial pattern repos
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/geospatial-cookbooks

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
