name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for r in postgis-patterns qgis-resources geospatial-api-reference duckdb-spatial-patterns proxmox-ceph-operations ollama-fleet-patterns pgrouting-patterns geopandas-patterns gdal-patterns stac-patterns maplibre-patterns cog-patterns geoparquet-patterns h3-patterns geospatial-patterns; do grep -q "$r" README.md || { echo "missing $r in README"; exit 1; }; done; echo "index complete"
